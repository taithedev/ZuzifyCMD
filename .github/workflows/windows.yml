name: Windows installer and release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Read and validate release version
        id: version
        shell: pwsh
        run: |
          $client = Get-Content client/zuzifycmd.py -Raw
          $match = [regex]::Match($client, '(?m)^VERSION = "([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+[a-z])"\s*
      - run: python tools/generate_icon.py
      - run: python client/zuzifycmd.py --self-test
      - run: python -m PyInstaller --onefile --name ZuzifyCMD --icon assets/zuzifycmd.ico --collect-all keyring client/zuzifycmd.py
      - run: .\dist\ZuzifyCMD.exe --self-test
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc installer\ZuzifyCMD.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ZuzifyCMD-${{ steps.version.outputs.tag }}
          path: |
            dist/ZuzifyCMD.exe
            dist/ZuzifyCMD-Setup.exe
)
          if (!$match.Success) { throw "Invalid release version" }
          $version = $match.Groups[1].Value
          if (!(Select-String -Path installer/ZuzifyCMD.iss -Pattern ('^AppVersion=' + [regex]::Escape($version) + '
      - run: python tools/generate_icon.py
      - run: python client/zuzifycmd.py --self-test
      - run: python -m PyInstaller --onefile --name ZuzifyCMD --icon assets/zuzifycmd.ico --collect-all keyring client/zuzifycmd.py
      - run: .\dist\ZuzifyCMD.exe --self-test
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc installer\ZuzifyCMD.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ZuzifyCMD-v1.2.0.1a
          path: |
            dist/ZuzifyCMD.exe
            dist/ZuzifyCMD-Setup.exe
) -Quiet)) { throw "Installer version mismatch" }
          "tag=v$version" >> $env:GITHUB_OUTPUT
      - run: python -m pip install -r requirements.txt
      - run: python tools/generate_icon.py
      - run: python client/zuzifycmd.py --self-test
      - run: python -m PyInstaller --onefile --name ZuzifyCMD --icon assets/zuzifycmd.ico --collect-all keyring client/zuzifycmd.py
      - run: .\dist\ZuzifyCMD.exe --self-test
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc installer\ZuzifyCMD.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ZuzifyCMD-v1.2.0.1a
          path: |
            dist/ZuzifyCMD.exe
            dist/ZuzifyCMD-Setup.exe
  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency:
      group: zuzifycmd-release-${{ needs.build.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ZuzifyCMD-${{ needs.build.outputs.tag }}
          path: dist
      - name: Publish tested installer and executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          $tag = $env:RELEASE_TAG
          $existing = gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release already exists. Increment VERSION and AppVersion for a new release."
            exit 0
          }
          Get-ChildItem dist/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath "dist/SHA256SUMS.txt" -Append -Encoding ascii
          }
          gh release create $tag dist/ZuzifyCMD-Setup.exe dist/ZuzifyCMD.exe dist/SHA256SUMS.txt --target $env:RELEASE_COMMIT --title "ZuzifyCMD $tag" --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
