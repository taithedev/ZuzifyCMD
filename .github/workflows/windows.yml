name: Windows build and release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python client/zuzifycmd.py --self-test
      - run: python -m PyInstaller --onefile --name ZuzifyCMD --collect-all psycopg_binary --collect-all keyring --collect-data certifi client/zuzifycmd.py
      - run: .\dist\ZuzifyCMD.exe --self-test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ZuzifyCMD-Windows
          path: dist/ZuzifyCMD.exe
  release:
    needs: windows
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ZuzifyCMD-Windows
          path: dist
      - name: Publish tested EXE
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          gh release view v1.1.0 *> $null
          if ($LASTEXITCODE -eq 0) { exit 0 }
          gh release create v1.1.0 dist/ZuzifyCMD.exe --target $env:RELEASE_COMMIT --title "ZuzifyCMD 1.1.0" --notes "Pink 3D ASCII flower, direct Neon connection, verified update downloads."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
